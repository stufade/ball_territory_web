<script type="module">

import {
  W, H, N, DT, ROUND, FINAL, NEL, FIRE, ICE, PLANT, BOLT, WATER, EARTH, WIND, POISON, METAL, SUN, SAND, LAVA, SLIME, VOID, CRYSTAL,

  newBall, Game, Duel, Draft, botDraft, botChoose, DUEL_SIZE, pickFree, recountState, seedRandom,
} from "./game.js";

// у картинки свой случайный генератор: так повтор матча (рилс) не зависит от искр и частиц
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const irnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = irnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let S = null, game = null;
const settings = { prompts: true, auto: false };
try { Object.assign(settings, JSON.parse(localStorage.getItem("bt-settings") || "{}")); } catch (e) { /* без хранилища тоже играем */ }
function saveSettings() { try { localStorage.setItem("bt-settings", JSON.stringify(settings)); } catch (e) { /* не страшно */ } }

// ---- звук: синтез на месте, без файлов, кроме голоса --------------------
const VOICE = "./choose.mp3";
const snd = (() => {
  let ac = null, out = null, voice = null;
  const now = () => ac.currentTime;
  function tone(f0, f1, d, v, type = "sine", at = 0) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = now() + at;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0008, t + d);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .02);
  }
  function hiss(d, v, freq = 3000, at = 0, swell = false) {
    if (!ac) return;
    const n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), a = buf.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = now() + at;
    s.buffer = buf; f.type = "lowpass"; f.frequency.value = freq;
    if (swell) { g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(v, t + d * .3); g.gain.exponentialRampToValueAtTime(.0008, t + d); }
    else { g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0008, t + d); }
    s.connect(f); f.connect(g); g.connect(out); s.start(t);
  }
  const chime = (fs, gap = .06, v = .13) => fs.forEach((f, i) => tone(f, f, .3, v, "sine", i * gap));
  let wallAt = 0;
  const PITCH = [260, 520, 390, 660, 330, 196, 587, 294, 440, 784, 349, 220, 494, 174, 1175, 247, 698, 370, 147, 880, 523, 311, 622, 165, 1047, 415, 932];
  return {
    start() {
      try {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          out = ac.createDynamicsCompressor(); out.connect(ac.destination);
          fetch(VOICE).then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b)).then(v => { voice = v; }).catch(() => {});
        }
        ac.resume();
      } catch (e) { ac = null; }
    },
    voice(tries = 0) {
      if (!ac) return;
      if (!voice) { if (tries < 20) setTimeout(() => this.voice(tries + 1), 100); return; }
      const s = ac.createBufferSource(), g = ac.createGain(); g.gain.value = 1.4;
      s.buffer = voice; s.connect(g); g.connect(ac.destination); s.start();
    },
    hit() { hiss(.07, .22, 5000); tone(200, 90, .1, .22); },
    ko() { tone(160, 45, .45, .45); hiss(.3, .2, 1500); },
    wall() { if (!ac || now() - wallAt < .12) return; wallAt = now(); tone(420, 300, .05, .04); },
    bump() { tone(300, 200, .06, .08); },
    tap() { tone(900, 1500, .08, .2); },
    redirect() { tone(1200, 1800, .06, .12); },
    tick() { tone(1500, 1500, .04, .08); },
    ready() { tone(880, 880, .07, .16); tone(1320, 1320, .12, .16, "sine", .08); },
    cut() { tone(220, 110, .25, .22); },
    launch() { tone(300, 1100, .3, .25); hiss(.3, .15); },
    prompt() { tone(660, 660, .1, .18); tone(990, 990, .14, .18, "sine", .12); },
    join() { tone(520, 780, .15, .18); },
    power(e) { const f = PITCH[e]; tone(f, f * 2.2, .28, .2); hiss(.25, .08, 5000); },
    strike() { tone(90, 70, .2, .25, "square"); hiss(.2, .3, 8000); },
    whoosh(d, f) { hiss(d, .35, f, 0, true); },
    quake() { tone(70, 40, .8, .5); hiss(.7, .35, 400); },
    magnet() { tone(120, 480, .4, .25); },
    splat() { for (let i = 0; i < 4; i++) tone(300, 120, .12, .18, "sine", i * .05); },
    pop() { tone(500, 900, .08, .14); },
    hole() { tone(400, 40, 2.4, .3); hiss(2.4, .12, 500); },
    six(word) { const f = word === "SIX" ? 392 : 523; tone(f, f, .18, .25, "square"); tone(80, 40, .4, .5); hiss(.3, .25, 1200); },
    gas() { hiss(1.1, .35, 600, 0, true); tone(90, 60, .6, .2, "sawtooth"); },
    sonic() { for (let i = 0; i < 3; i++) { tone(220, 110, .25, .25, "square", i * .2); hiss(.2, .2, 3000, i * .2); } },
    slowtime() { tone(600, 120, 1.2, .25); [988, 784, 659].forEach((f, i) => tone(f, f, .5, .1, "sine", i * .25)); },
    ghost() { tone(500, 300, .8, .18, "triangle"); tone(700, 420, .8, .1, "sine", .1); },
    fuse() { hiss(1.5, .12, 6000); },
    bubbles() { for (let i = 0; i < 5; i++) tone(500 + i * 120, 900 + i * 120, .08, .12, "sine", i * .06); },
    glitch() { for (let i = 0; i < 6; i++) tone(rnd(200, 2000), rnd(200, 2000), .05, .15, "square", i * .04); },
    itsme() { [659, 523, 659, 784].forEach((f, i) => tone(f, f, .16, .14, "triangle", i * .09)); },
    chime,
    win() { [392, 494, 587, 784].forEach(f => tone(f, f, 1.8, .12)); },
    timeUp() { tone(880, 440, .35, .25, "square"); tone(660, 330, .35, .18, "square", .05); hiss(.4, .2, 3000); },
    final() {
      tone(110, 440, .5, .3, "sawtooth"); hiss(.6, .25, 2500, 0, true);
      [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .16, .16, "square", .35 + i * .09));
      tone(1047, 1047, .7, .14, "triangle", .75); tone(1319, 1319, .7, .1, "triangle", .75);
    },
    crown() {
      [523, 659, 784].forEach((f, i) => tone(f, f, .14, .15, "triangle", i * .09));
      [1047, 1319, 1568].forEach(f => tone(f, f, 1.4, .1, "triangle", .3)); hiss(.5, .12, 9000, .3);
    },
    row() { tone(700, 1100, .07, .1); },
    // подпись стихии на экране победы
    sig(e) {
      const T = (f0, f1, d, v, type, at) => tone(f0, f1, d, v, type || "sine", at || 0);
      const seq = (fs, gap, v, type, d = .25) => fs.forEach((f, i) => T(f, f, d, v, type, i * gap));
      switch (e) {
        case FIRE: hiss(1.5, .5, 2200, 0, true); T(80, 320, 1.2, .3, "sawtooth"); T(320, 90, .7, .2, "sine", .7); break;
        case ICE: for (let i = 0; i < 9; i++) { const f = rnd(1800, 3600); T(f, f, .18, .1, "sine", i * .04); } hiss(.4, .25, 9000); seq([1568, 2093, 2637], .1, .08, "sine", .5); break;
        case PLANT: seq([392, 523, 659, 784, 1047], .08, .14, "triangle"); hiss(.7, .1, 3000, 0, true); break;
        case BOLT: for (const at of [0, .4, .8]) { T(90, 60, .25, .3, "square", at); hiss(.25, .4, 8000, at); } break;
        case WATER: hiss(1.3, .4, 1200, 0, true); for (let i = 0; i < 5; i++) T(300 + i * 90, 700 + i * 90, .1, .14, "sine", .3 + i * .09); break;
        case EARTH: T(70, 35, 1.2, .6); hiss(1, .4, 400); T(120, 50, .5, .3, "square", .3); break;
        case WIND: hiss(1.5, .45, 3000, 0, true); T(300, 900, 1.2, .08, "triangle"); break;
        case POISON: for (let i = 0; i < 9; i++) { const f = rnd(200, 500); T(f, f * 1.8, .1, .15, "sine", i * .07); } hiss(.8, .15, 1500, 0, true); break;
        case METAL: T(880, 880, .9, .15); T(1320, 1320, .9, .1, "sine", .05); T(120, 480, .4, .25, "square", .2); hiss(.2, .3, 9000, .2); break;
        case SUN: seq([1047, 1319, 1568, 2093], .06, .13); hiss(.5, .15, 9000); break;
        case SAND: hiss(1.6, .4, 2500, 0, true); for (let i = 0; i < 6; i++) T(1500, 1500, .03, .08, "sine", .2 + i * .15); break;
        case LAVA: T(130, 36, .9, .6); hiss(1.3, .4, 1200, 0, true); for (let i = 0; i < 4; i++) T(120, 200, .15, .2, "sine", .4 + i * .15); break;
        case SLIME: for (let i = 0; i < 7; i++) T(300, 120, .12, .2, "sine", i * .08); break;
        case VOID: T(500, 40, 1.6, .4); hiss(1.6, .15, 500, 0, true); break;
        case CRYSTAL: seq([1760, 2217, 2637, 3520], .05, .1); T(1760, 1760, 1, .06, "sine", .3); hiss(.3, .2, 9000); break;
        case MUSHROOM: for (let i = 0; i < 7; i++) T(500, 900, .08, .15, "sine", i * .1); break;
        case SMILEY: seq([659, 523, 659, 784, 1047], .1, .14, "triangle", .16); break;
        case SIX7: for (const [f, at] of [[392, 0], [523, .45], [392, .9], [523, 1.35]]) { T(f, f, .2, .28, "square", at); T(80, 40, .35, .45, "sine", at); } break;
        case GAS: hiss(1.5, .4, 600, 0, true); T(90, 60, .8, .25, "sawtooth"); T(130, 36, .7, .45, "sine", .7); hiss(.5, .3, 1800, .7); break;
        case SOUND: for (let i = 0; i < 4; i++) { T(220, 110, .25, .25, "square", i * .3); hiss(.2, .2, 3000, i * .3); } break;
        case YINYANG: T(392, 392, 1.5, .12); T(587, 587, 1.4, .1, "sine", .35); T(784, 784, 1.2, .08, "sine", .7); hiss(1, .12, 4000, 0, true); break;
        case TIME: for (let i = 0; i < 8; i++) T(1500, 1500, .04, .12, "sine", i * .12); T(600, 120, 1.2, .2, "sine", 1); break;
        case GHOST: T(500, 300, 1.1, .2, "triangle"); T(700, 420, 1, .12, "sine", .15); T(400, 250, 1, .1, "triangle", .5); break;
        case BOMB: hiss(.6, .12, 6000); T(130, 36, .9, .7, "sine", .6); hiss(.7, .5, 1800, .6); break;
        case BUBBLE: for (let i = 0; i < 11; i++) T(500 + i * 80, 900 + i * 80, .08, .12, "sine", i * .07); break;
        case GLITCH: for (let i = 0; i < 12; i++) T(rnd(200, 2000), rnd(200, 2000), .05, .15, "square", i * .05); break;
        case CANDY: seq([784, 988, 1175, 1568, 1976], .06, .12, "triangle"); for (let i = 0; i < 4; i++) T(500, 900, .08, .1, "sine", .4 + i * .1); break;
        default: chime([523, 659, 784, 1047]);
      }
    },
    reaction(k) {
      if (k === "WILDFIRE" || k === "FIRESTORM") { hiss(.9, .45, 2200); tone(90, 220, .9, .22); }
      else if (["STEAM", "SANDSTORM", "TOXIC STORM", "PURIFY", "SPLASH"].includes(k)) { hiss(.8, .32, k === "STEAM" ? 9000 : 2500, 0, true); if (k === "PURIFY") chime([784, 988, 1175]); }
      else if (k === "CHAIN") { tone(130, 110, .6, .2, "square"); hiss(.6, .2, 8000); }
      else if (k === "PRISM") { chime([1319, 1568, 1976, 2637], .04); hiss(.2, .2, 9000); }
      else if (["BLOOM", "OASIS", "MYCELIUM", "SWAMP"].includes(k)) chime([523, 659, 784, 1047]);
      else if (["FROST", "GLASS", "GEODE", "REFLECTION", "MIRROR", "CRACK", "FREEZE FRAME", "HARMONY"].includes(k)) { chime([1568, 2093, 2637], .05, .1); hiss(.25, .15, 9000); }
      else if (["SLIME FLOOD", "ACID", "BLIGHT", "TOXIC TIDE"].includes(k)) { for (let i = 0; i < 6; i++) { const f = rnd(200, 500); tone(f, f * 1.8, .1, .15, "sine", i * .05); } if (k === "ACID") hiss(.5, .2, 6000); }
      else if (k === "SHATTER" || k === "AVALANCHE") { for (let i = 0; i < 7; i++) { const f = rnd(1800, 3600); tone(f, f, .16, .11, "sine", i * .025); } hiss(.2, .25, 9000); if (k === "AVALANCHE") tone(90, 40, .8, .4); }
      else if (["BLAST", "BOOM", "DUNK", "EXPLOSION", "DETONATE"].includes(k)) { tone(130, 36, .7, .6); hiss(.5, .35, 1800); }
      else if (k === "DEVOUR") tone(500, 50, .7, .4);
      else { hiss(.5, .22, 1500, 0, true); tone(180, 70, .4, .35, "sine", .1); if (k === "FORGE") { tone(880, 880, .5, .1, "sine", .12); tone(1320, 1320, .5, .1, "sine", .12); } }
    },
  };
})();

// ---- вид ----------------------------------------------------------------
const VW = 720, VH = 1280, CELL = 34, FX = 20, FY = 226, FW = W * CELL, FH = H * CELL;
const BG = "#11132a", PANEL = "#1f2244", GOOD = "#00e66e", BAD = "#ff3c46";
const RGB = [[255, 84, 44], [64, 186, 255], [46, 208, 104], [255, 208, 40], [26, 84, 230], [150, 96, 52], [128, 236, 200],
  [156, 60, 226], [150, 162, 184], [255, 248, 214], [226, 160, 70], [206, 24, 58], [255, 96, 196], [22, 12, 34], [0, 186, 170], [176, 224, 48], [255, 226, 40], [255, 140, 0],
  [150, 170, 40], [230, 30, 150], [200, 200, 200], [80, 70, 200], [200, 190, 255], [80, 105, 55], [120, 230, 240], [255, 43, 214],
  [255, 51, 85]];
// у трёх шаров территория в клетку из двух цветов: так их не спутать с похожими
const PATTERN = { [YINYANG]: [[242, 242, 242], [38, 38, 38]], [GLITCH]: [[255, 43, 214], [43, 240, 255]], [CANDY]: [[255, 51, 85], [255, 255, 255]] };
const hex = c => "#" + c.map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, "0")).join("");
const mixc = (c, d, k) => c.map((v, i) => v + (d[i] - v) * k);
const COL = RGB.map(hex), LIGHT = RGB.map(c => hex(mixc(c, [255, 255, 255], .5))), DARK = RGB.map(c => hex(mixc(c, [0, 0, 0], .55)));
LIGHT[VOID] = "#c496ff"; DARK[VOID] = "#783cdc";
const NAMECOL = COL.slice(); NAMECOL[VOID] = "#b078ff"; NAMECOL[EARTH] = "#d29660";
const BRIGHT = COL.slice(); BRIGHT[VOID] = "#9650ff";
const ICON_DARK = [BOLT, SUN, WIND, SAND, MUSHROOM, SMILEY, GHOST, BUBBLE, YINYANG];
const ON_COL = e => ICON_DARK.includes(e) || e === ICE || e === CRYSTAL ? "#0e0a22" : "#fff";
const RXCOL = {
  WILDFIRE: "#ff781e", STEAM: "#ebf5ff", CHAIN: "#96d7ff", BLOOM: "#78ff96", SHATTER: "#bef0ff", BLAST: "#ffe15a", FROST: "#aaebff",
  OASIS: "#96ff78", OBSIDIAN: "#be8cff", QUICKSAND: "#f0c878", MUDSLIDE: "#c88c50", AVALANCHE: "#e6f5ff", FIRESTORM: "#ff8c28",
  "TOXIC STORM": "#c86eff", SANDSTORM: "#ffd68c", BLIGHT: "#be5aff", "TOXIC TIDE": "#aaff5a", FORGE: "#ffbe5a", GLASS: "#c8faff",
  "SLIME FLOOD": "#ff78d2", ACID: "#beff3c", DEVOUR: "#be78ff", PURIFY: "#ffffc8", BOOM: "#ffaa3c", PRISM: "#ffffff",
  GEODE: "#78ffeb", MYCELIUM: "#d2ff6e", SWAMP: "#96dc5a", REFLECTION: "#fff08c", MIRROR: "#e6ffff", DUNK: "#ffa028",
  SPLASH: "#8cc8ff", EXPLOSION: "#ffb43c", CRACK: "#c8faff", HARMONY: "#f0f0f0", HOURGLASS: "#ffd68c", "FREEZE FRAME": "#aab4ff",
  HAUNT: "#d2c8ff", DETONATE: "#ff8c3c", FOAM: "#c8f5ff", CORRUPT: "#ff2bd6", SYRUP: "#ff7896",
};
const BIG = ["WILDFIRE", "CHAIN", "SHATTER", "BLAST", "BOOM", "DEVOUR", "FIRESTORM", "AVALANCHE", "PRISM", "GEODE", "DUNK", "MIRROR", "EXPLOSION", "DETONATE", "FREEZE FRAME"];
const FONT = '"Archivo Black", "Arial Black", Impact, sans-serif', BOLD = 'Arial, Helvetica, sans-serif';
const FLAME = [[.05, -1], [.32, -.42], [.62, -.05], [.66, .45], [.3, .9], [0, 1], [-.36, .88], [-.66, .42], [-.6, 0], [-.38, .15], [-.34, -.3]];
const LEAF = [[0, -1], [.46, -.62], [.68, -.1], [.5, .45], [.05, .82], [-.45, .48], [-.68, -.05], [-.46, -.6]];
const BOLTP = [[.2, -1], [-.56, .16], [-.06, .16], [-.26, 1], [.6, -.28], [.08, -.28], [.42, -1]];
const EARTHP = [[-1, .8], [-.42, -.42], [-.14, -.04], [.3, -.8], [1, .8]];

const GEM = [[0, -1], [.62, -.35], [.4, .9], [-.4, .9], [-.62, -.35]];

const cv = document.getElementById("game"), g = cv.getContext("2d");
function poly(pts, x, y, r, fill) {
  g.beginPath();
  pts.forEach((p, i) => g[i ? "lineTo" : "moveTo"](x + p[0] * r, y + p[1] * r));
  g.closePath(); g.fillStyle = fill; g.fill();
}
function circle(x, y, r, fill) { if (!(r > 0)) return; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function line(x0, y0, x1, y1, col, w) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function ringAt(x, y, r, col, w) { if (!(r > 0)) return; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); }
function icon(e, x, y, r, fill, hole) {
  hole = hole || COL[e];
  if (e === FIRE) poly(FLAME, x, y, r, fill);

    if (!b || Math.abs(r[1] - b.x) + Math.abs(r[2] - b.y) > 3) continue;
    let a = r[3];
    while (a - b.ang > Math.PI) a -= Math.PI * 2;

  }
}
function applySnap(st) {

  net.cur = st;
  if (S && S.mirror) for (const b of S.balls) { b.ox = b.x; b.oy = b.y; }
  if (!st.o || st.o.length !== N || !Array.isArray(st.b)) return;
  if (!S || S.m !== st.m) {
    S = { m: st.m, tick: 0, t: 0, owner: new Int8Array(N).fill(-1), src: new Int8Array(N).fill(-1), L: {}, fade: new Float32Array(N),
      flash: new Float32Array(N), players: st.b.map(r => r[0]), balls: [], by: {}, counts: new Array(NEL).fill(0), reactions: 0,
      promptUntil: -1, clones: [], mirror: true };
    const ar = Array.isArray(st.ar) ? st.ar : [0, 0, W, H];
    Object.assign(S, { ax0: ar[0], ay0: ar[1], ax1: ar[2], ay1: ar[3], inA: new Uint8Array(N), area: (ar[2] - ar[0]) * (ar[3] - ar[1]) });
    for (let j = ar[1]; j < ar[3]; j++) for (let i = ar[0]; i < ar[2]; i++) S.inA[j * W + i] = 1;
    for (const n of LAYERS) S.L[n] = new Float32Array(N);
    for (const r of st.b) { const b = newBall(r[0], r[1], r[2], null); S.balls.push(b); S.by[r[0]] = b; if (r[18] && r[18] === net.me) S.you = b; }
    S.you = S.you || null;
    fx.reset(); net.lastEv = 0; net.launchedSent = false; game = null;
    phase = st.ph === "aim" ? "aim" : "play"; aimStart = fx.now; endAt = fx.now;  // конец покажет startWin ниже
  }

  for (let k = 0; k < N; k++) {
    const o = st.o.charCodeAt(k) === 46 ? -1 : st.o.charCodeAt(k) - 97;

  }

    b.pang = b.rang !== undefined ? b.rang : r[3];
    b.x = r[1]; b.y = r[2]; b.ang = r[3];
    while (b.ang - b.pang > Math.PI) b.pang += Math.PI * 2;
    while (b.pang - b.ang > Math.PI) b.pang -= Math.PI * 2;
    if (Math.abs(b.x - b.px) + Math.abs(b.y - b.py) > 3) { b.px = b.x; b.py = b.y; }
    b.hp = r[4]; b.alive = !!r[5]; b.charge = r[6];
    b.stun = r[7] & 1 ? 1 : 0; b.bigT = r[7] & 2 ? 1 : 0; b.invuln = r[7] & 4 ? 1 : 0; b.surge = r[7] & 8 ? 1 : 0;
    b.phaseT = r[7] & 16 ? 1 : 0; b.rushT = r[7] & 32 ? 1 : 0; b.slowT = r[7] & 64 ? 1 : 0; b.hasteT = r[7] & 128 ? 1 : 0;
    b.hole = r[8]; b.hx = r[9]; b.hy = r[10]; b.sx = r[11]; b.sy = r[12];
    if (!aimingMine) { b.dx = r[13]; b.dy = r[14]; }
    b.powers = r[15]; b.kills = r[16]; b.name = b === S.you ? "" : (r[17] || "").toUpperCase();
  }
  S.clones = (st.c || []).map(([x, y, e]) => ({ x, y, e }));
  S.bubbles = (st.u || []).map(([x, y, e]) => ({ x, y, e }));
  S.bombs = (st.k || []).map(([x, y, left]) => ({ x, y, t: st.t + left }));
  S.t = st.t; S.tick = Math.round(st.t * 30); S.reactions = st.rx; S.promptUntil = st.pu; S.final = !!st.fin;
  S.round = st.rd || ROUND; S.finalAt = st.fa || FINAL;
  D = st.dm ? Object.assign({}, st.dm, { side: Array.isArray(st.dm.pids) ? st.dm.pids.indexOf(net.me) : -1 }) : null;
  if (st.ph === "rend" && phase !== "rend" && D) roundOver();
  recountState(S);
  for (const q of st.ev || []) {
    if (!Array.isArray(q) || q[0] <= net.lastEv) continue;
    net.lastEv = q[0];

}

// ---- одиночная игра: тот же модуль правил прямо в браузере --------------
function flushEvents() { for (const q of game.drain()) applyFx(q[1], q[2]); }
function openPick() {
  phase = "pick"; pickAt = fx.now; chosen = -1; snd.voice();
  if (!spun) {
    spun = true;
    const hops = []; let t = .3, gap = .04;
    for (const e of shuffle([...Array(NEL).keys()]).slice(0, 12)) { hops.push([t, e]); t += gap; gap *= 1.16; }
    roulette = { hops, end: t };
  } else roulette = null;
}
function startSolo(e) {
  tut = null; duel = null; D = null; DR = null; draft = null; track("solo_start", { v: e });
  const used = [e];
  for (let i = 0; i < 3; i++) used.push(pickFree(used));
  game = new Game(used.map((q, i) => ({ e: q, ctl: i === 0 ? "me" : null })));
  S = game.S; S.you = S.by[e]; S.you.auto = settings.auto;
  game.drain(); fx.reset(); phase = "aim"; aimStart = fx.now; dragging = false; acc = 0;
}
function launchSolo() { phase = "play"; acc = 0; game.launch(); flushEvents(); if (tut) tutGo("paint"); }

// ---- цикл ----------------------------------------------------------------
function update(dt) {
  fx.now += dt;
  if (phase === "pick" && roulette) {
    const k = fx.now - pickAt;
    for (const h of roulette.hops) if (!h[2] && k >= h[0]) { h[2] = true; snd.tick(); }
    if (k > roulette.end) roulette = null;
  }
  if (net.mode === "online" && fx.now - net.pingAt > 3) { net.pingAt = fx.now; send({ t: "ping", c: performance.now() }); }
  const solo = net.mode === "solo" && game;
  if (tut && S) tutUpdate();
  const stop = tutStop();
  const slow = stop ? 0 : solo ? (S.slow > 0 ? 1 / 3 : 1) * (S.t < S.promptUntil && settings.prompts ? .5 : 1) : 1;
  if (solo && phase === "aim" && !tut && fx.now - aimStart > AIM_LIMIT) launchSolo();
  if (solo && phase === "play" && !stop) {
    S.you.auto = settings.auto;
    acc += dt * slow;
    while (acc >= DT && phase === "play") {
      acc -= DT; if (S.slow > 0) S.slow -= DT;
      game.step(); flushEvents();
      if (S.done) { if (duel) duelRoundEnd(); else startWin(); }
    }
  }
  if (net.mode === "solo" && (draft || duel)) soloDuelUpdate();
  if (S && (phase === "play" || phase === "aim") && Math.random() < .3) ambient();
  const sd = dt * slow;
  for (const p of fx.parts) { p.x += p.vx * sd; p.y += p.vy * sd; p.vx *= .95; p.vy *= .95; p.t += sd; }
  fx.parts = fx.parts.filter(p => p.t < p.life);
  const n = fx.now, live = (a, l) => a.filter(q => n - q.t < (l || q.life));
  fx.rings = live(fx.rings); fx.arcs = live(fx.arcs); fx.beams = live(fx.beams); fx.calls = live(fx.calls); fx.words = live(fx.words, .95); fx.formulas = live(fx.formulas, 1.5);
  const f = dt * 60;
  fx.shake *= .86 ** f; fx.zoom *= .84 ** f; fx.tintK *= .78 ** f;
  if (S) { const d = .74 ** (dt * 30); for (let k = 0; k < N; k++) if (S.flash[k] > 0) S.flash[k] *= d; }
  if (S && S.mirror) playQueue();
  if (phase === "end" && win.e >= 0) winStep(dt);
}
function ambient() {
  for (const b of S.balls) if (b.alive) {
    const c = cellOf(b);
    for (const [n, col] of [["bush", "#5ad678"], ["water", "#96d2ff"], ["ice", "#ebfaff"], ["sand", "#f0d296"], ["slime", "#ff8cd2"]]) {
      if (S.L[n][c] > 0) { fx.burst(b.x, b.y, col, 3, 130, .3, 2, 4); break; }
    }
  }
  for (const [n, cnt, cols, v0, v1] of [["burn", 5, ["#ffd246", "#ff781e"], -170, -70], ["lava", 2, ["#ffa028", "#ff5a14"], -120, -40], ["toxic", 2, ["#d68cff", "#aaff5a"], -60, -20]]) {
    const hot = [];
    for (let k = 0; k < N; k++) if (S.L[n][k] > 0) hot.push(k);
    for (let i = 0; i < Math.min(cnt, hot.length); i++) {
      const k = pick(hot);
      fx.parts.push({ x: px(k % W + Math.random()), y: py((k / W | 0) + Math.random()), vx: rnd(-30, 30), vy: rnd(v0, v1), life: rnd(.3, .6), t: 0, r: irnd(2, 4), col: pick(cols) });
    }
  }
}
function draw() {
  const t = fx.now;

  document.getElementById("nick").hidden = phase !== "name";

  if (phase === "settings") { drawSettings(); return; }
  if (phase === "pick") { drawPick(t); return; }
  if (phase === "ddraft" && DR) { drawDraft(t); return; }
  if (phase === "dchoose" && DR && DR.dm) { drawChoose(t); return; }
  if (phase === "join") { drawJoin(); return; }
  if (phase === "name") { drawName(); return; }
  if (phase === "lobby" || !S) { if (phase !== "lobby") phase = "lobby"; drawLobby(t); return; }
  g.fillStyle = BG; g.fillRect(0, 0, VW, VH);
  const aiming = phase === "aim";
  g.fillStyle = "#171936"; g.fillRect(0, 1052, VW, VH - 1052);
  const q = !S.mirror && phase === "play" ? Math.min(1, acc / DT) : 1;
  if (S.mirror) for (const b of S.balls) { b._px = b.px; b._py = b.py; b._pa = b.pang; b.px = b.rx; b.py = b.ry; b.pang = b.rang; }
  if (S.mirror) for (const b of S.balls) { b._x = b.x; b._y = b.y; b._a = b.ang; b.x = b.rx; b.y = b.ry; b.ang = b.rang; }
  setView();
  drawField(t, q, aiming);
  drawHud(t);
  if (S.mirror && net.ping) txt(`${Math.round(net.ping)} ms`, 704, 24, 17, net.ping < 120 ? "#7ee6a8" : net.ping < 250 ? "#ffd63c" : "#ff7878", { a: "right" });
  if (S.you) drawButton(t); else { g.fillStyle = PANEL; g.fillRect(20, 1150, 680, 106); big("WATCHING", VW / 2, 1203, 44, "#8c90b8"); }
  drawCalls(t);
  if (S.mirror) for (const b of S.balls) { b.x = b._x; b.y = b._y; b.ang = b._a; b.px = b._px; b.py = b._py; b.pang = b._pa; }

    const [a, b] = D.cur.map(e => TITLE[e] || "?");
    big(`ROUND ${D.round}`, VW / 2, FY + 160, 40, "#ffd63c", { stroke: 5 });
    big(`${a}  VS  ${b}`, VW / 2, FY + 214, 44, "#fff", { stroke: 5, max: 660 });
  }

function frame(ms) {
  const dt = Math.min(.05, (ms - lastT) / 1000 || 0);

function fit() {
  const st = getComputedStyle(document.body);
  const aw = document.body.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
  const ah = document.body.clientHeight, k = Math.min(aw / VW, ah / VH), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = VW * k + "px"; cv.style.height = VH * k + "px";
  cv.width = Math.round(VW * k * dpr); cv.height = Math.round(VH * k * dpr);
  g.setTransform(cv.width / VW, 0, 0, cv.height / VH, 0, 0);
  const r = cv.getBoundingClientRect();
  document.getElementById("code").style.top = r.top + r.height * (560 / VH) + "px";
  document.getElementById("nick").style.top = r.top + r.height * (540 / VH) + "px";
}

// ---- ввод ----------------------------------------------------------------
function at2(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * VW, (e.clientY - r.top) / r.height * VH];
}
function aimAt(x, y) {
  const b = S.you, dx = cellX(x) - b.x, dy = cellY(y) - b.y, n = Math.hypot(dx, dy);
  if (n < .4) return;
  b.dx = dx / n; b.dy = dy / n;
  if (net.mode === "online" && fx.now - net.aimAt > .05) { net.aimAt = fx.now; send({ t: "aim", dx: r2(b.dx), dy: r2(b.dy) }); }
}
function tryPress() {
  const b = S && S.you;
  if (!b || phase !== "play" || !b.alive || b.charge < 1) return;
  fx.press = fx.now; snd.tap(); haptic("medium");
  if (net.mode === "online") send({ t: "press" });
  else { game.press(b.e); flushEvents(); }
}
function tapField(x, y) {
  const b = S.you;
  if (!b || !b.alive) return;
  const dx = cellX(x) - b.x, dy = cellY(y) - b.y;
  if (Math.hypot(dx, dy) < .4) return;
  haptic("light");
  if (net.mode === "online") { send({ t: "dir", dx: r2(dx), dy: r2(dy) }); fx.ring(cellX(x), cellY(y), 70, 10, .4, "#fff", 8); }
  else { game.redirect(b.e, dx, dy); flushEvents(); }
}
function joinFromInput() {
  const v = (document.getElementById("code").value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  if (v.length !== 4) { net.err = "The code has 4 letters or digits."; return; }
  track("room_join");
  connect(v);
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  snd.start();
  const [x, y] = at2(e);
  if (phase === "title") {
    net.err = "";
    if (inside(BTN.gear, x, y)) { prevPhase = "title"; phase = "settings"; }
    else if (inside(BTN.solo, x, y)) openPick();
    else if (inside(BTN.duel, x, y)) openDuel();
    else if (inside(BTN.create, x, y)) { if (!myName()) askName(createRoom); else createRoom(); }
    else if (inside(BTN.join, x, y)) {
      const go = () => { phase = "join"; setTimeout(() => document.getElementById("code").focus(), 50); };
      if (!myName()) askName(go); else go();
    } else if (inside(BTN.tut, x, y)) startTutorial();
    else if (!tg && Math.abs(y - 560) < 40 && Math.abs(x - VW / 2) < 200) askName(null);
  } else if (phase === "settings") {
    if (inside(BTN.togPrompts, x, y) || (y > 300 && y < 490)) settings.prompts = !settings.prompts;
    else if (inside(BTN.togAuto, x, y) || (y > 530 && y < 720)) settings.auto = !settings.auto;
    else if (inside(BTN.back, x, y)) phase = prevPhase;
    saveSettings();
    send({ t: "settings", auto: settings.auto, prompts: settings.prompts });
  } else if (phase === "name") {
    if (inside(BTN.nameOk, x, y)) saveName();
    else if (inside(BTN.back, x, y)) { const back = afterName && net.ws ? "lobby" : "title"; afterName = null; phase = back; }
  } else if (phase === "join") {
    if (inside(BTN.joinGo, x, y)) joinFromInput();
    else if (inside(BTN.back, x, y)) { net.err = ""; phase = "title"; }
  } else if (phase === "ddraft" || phase === "dchoose") {
    if (DR) duelTap(x, y);
  } else if (phase === "pick") {
    if (inside(BTN.gear, x, y)) { prevPhase = "pick"; phase = "settings"; return; }
    if (inside(BTN.play, x, y)) { startSolo(chosen >= 0 ? chosen : irnd(0, NEL - 1)); return; }
    const q = gridHit(x, y, 262, 110, 38);
    if (q >= 0) { chosen = q; roulette = null; snd.power(q); }
  } else if (phase === "lobby") {
    if (net.confirm) {
      if (inside(BTN.ok, x, y)) { net.confirm = false; send({ t: "start" }); }
      else if (inside(BTN.wait, x, y)) net.confirm = false;
      return;
    }
    if (inside(BTN.leave, x, y)) { leaveRoom(); return; }
    if (inside(BTN.invite, x, y)) { invite(); return; }
    if (net.me === net.host && inside(BTN.mode, x, y)) { send({ t: "mode", m: net.gm === "duel" ? "ffa" : "duel" }); return; }
    if (!tg && inside(BTN.rename, x, y)) { askName(() => { phase = "lobby"; }); return; }
    const online = net.ws && net.ws.readyState === 1;
    if (!online && net.err && inside(BTN.reconnect, x, y)) { connect(net.code); return; }
    if (net.me === net.host && inside(BTN.start, x, y)) { if (net.seats.length < (net.gm === "duel" ? 2 : 4)) net.confirm = true; else send({ t: "start" }); return; }
    const q = gridHit(x, y, 392, 96, 31);
    if (net.gm === "duel") { if (q >= 0) { chosen = q; snd.tick(); } return; }
    const taken = net.seats.filter(s => s.id !== net.me && s.e >= 0).map(s => s.e);
    if (q >= 0 && !taken.includes(q)) { chosen = q; snd.power(q); send({ t: "pick", e: q }); }
  } else if (tut && (phase === "aim" || phase === "play") && tutTap(x, y)) {
    return;
  } else if (phase === "aim" && S.you && !net.launchedSent) {
    dragging = true; aimAt(x, y);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* необязательно */ }
  } else if (phase === "play") {
    if (y >= 1130) tryPress();
    else if ((promptOn() || finalOn()) && y > FY && y < FY + FH) tapField(x, y);
  } else if (phase === "end" && fx.now - endAt > 3) {
    if (tut) {
      if (inside(BTN.again, x, y)) { tut = null; S = null; game = null; openPick(); }
      else if (inside(BTN.change, x, y)) { tut = null; S = null; game = null; phase = "title"; }
    } else if (duel && net.mode === "solo") {
      if (inside(BTN.again, x, y)) openDuel();
      else if (inside(BTN.change, x, y)) { duel = null; draft = null; D = null; DR = null; S = null; game = null; phase = "title"; }
    } else if (net.mode === "solo") {
      if (inside(BTN.again, x, y)) startSolo(S.you.e);
      else if (inside(BTN.change, x, y)) { phase = "pick"; pickAt = fx.now; chosen = S.you.e; }
    } else if (net.me === net.host) {
      if (inside(BTN.again, x, y)) send({ t: "start" });
      else if (inside(BTN.change, x, y)) send({ t: "lobby" });
    }
  }
});
cv.addEventListener("pointermove", e => { if (phase === "aim" && dragging) aimAt(...at2(e)); });
cv.addEventListener("pointerup", e => {
  if (phase !== "aim" || !dragging) return;
  aimAt(...at2(e)); dragging = false;
  if (net.mode === "solo") launchSolo();
  else { net.launchedSent = true; send({ t: "launch", d: [r2(S.you.dx), r2(S.you.dy)] }); }
});
window.addEventListener("keydown", e => {
  if (e.code === "Space" && phase === "play") { e.preventDefault(); if (tut && tut.step === "power") tutTap(VW / 2, 1200); else if (!tutStop()) tryPress(); }
  if (e.key === "Enter" && phase === "join") joinFromInput();
  if (e.key === "Enter" && phase === "name") saveName();
});
window.addEventListener("resize", fit);
if (tg && tg.onEvent) tg.onEvent("viewportChanged", fit);
if (document.fonts && document.fonts.load) document.fonts.load('40px "Archivo Black"').catch(() => {});
fit();
// вход в комнату по ссылке: из Telegram (startapp=r_abcd) или из браузера (?room=abcd)
const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
const urlRoom = new URLSearchParams(location.search).get("room") || "";
const joinCode = (/^r_([a-z0-9]{4})$/i.exec(startParam) || [])[1] || (/^[a-z0-9]{4}$/i.test(urlRoom) ? urlRoom : "");
const demo = new URLSearchParams(location.search).get("play");
track("open");
if (joinCode) { track("room_join"); connect(joinCode.toLowerCase()); }
else if (demo !== null && TITLE.includes(demo.toUpperCase())) { startSolo(TITLE.indexOf(demo.toUpperCase())); }
requestAnimationFrame(frame);
